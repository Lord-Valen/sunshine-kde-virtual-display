# Sunshine config — KDE Plasma 6 / Wayland.
#   capture = kwin   krfb-virtualmonitor outputs are compositor-level; the kms
#                    backend can't see them.
# output_name is static: the connect hook always creates the virtual output
# with this exact name, so no launcher script is needed — run Sunshine as a
# plain systemd daemon with this config in place.
capture = kwin
encoder = nvenc
fec_percentage = 20
locale = en
min_log_level = 2
output_name = Virtual-SunshineHeadless
sunshine_name = Sunshine PC KDE
# global_prep_cmd is written with absolute paths to wherever this repo lives,
# e.g.:
# global_prep_cmd = [{"do":"/path/to/this/repo/scripts/sunshine-connect.sh","undo":"/path/to/this/repo/scripts/sunshine-disconnect.sh","elevated":"false"}]
